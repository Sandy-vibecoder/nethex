name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: cp app/build/outputs/apk/release/app-release.apk Nethex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nethex
          path: Nethex.apk

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nethex (latest build)
          body: "Installable APK. Download Nethex.apk below, open it on the phone, allow installs from this source."
          files: Nethex.apk
          prerelease: false
