name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key from secrets (skipped on forks without secrets)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect
        run: cp app/build/outputs/apk/release/app-release.apk Nethex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nethex
          path: Nethex.apk

      - name: Publish as the "latest" release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nethex (latest build)
          body: "Installable APK. Download Nethex.apk below, open it on the phone, allow installs from this source."
          files: Nethex.apk
          prerelease: false
